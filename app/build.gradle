plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing comes ONLY from environment variables set by the build workflow from
// GitHub Secrets. Nothing secret is ever written into this repository.
def ksFile = System.getenv('SIGNING_KEYSTORE_FILE')
def releaseSigningConfigured = ksFile != null && file(ksFile).exists() &&
        System.getenv('SIGNING_KEYSTORE_PASSWORD') && System.getenv('SIGNING_KEY_ALIAS')

android {
    namespace 'dev.momolite'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.momolite'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.0.0'
        resConfigs 'ar'
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv('SIGNING_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.xerial:sqlite-jdbc:3.46.1.3'
}
