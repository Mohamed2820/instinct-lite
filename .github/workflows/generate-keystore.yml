name: Generate signing keystore (run once)

# Manual only. Creates the release signing key, protected by the password YOU stored as a
# repository Secret. This workflow never creates, chooses, prints or stores a password.
#
# Limits that are facts about GitHub, not choices:
#  - A workflow cannot write repository Secrets with its default token, so you add the
#    keystore Secret yourself (docs/SIGNING.md has the exact steps).
#  - On a public repository anyone signed in to GitHub can download artifacts. The keystore
#    is password-protected (PKCS12), so its safety depends on your password being long and random.
#    Download it once, store it somewhere safe, then delete the artifact.
on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Type YES: the keystore artifact is downloadable by GitHub users until I delete it"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check acknowledgement and password Secret
        env:
          ACK: ${{ inputs.acknowledge }}
          PW: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          [ "$ACK" = "YES" ] || { echo "Type YES in the acknowledge input." >&2; exit 1; }
          [ -n "$PW" ] || { echo "Add the Secret SIGNING_KEYSTORE_PASSWORD first (docs/SIGNING.md)." >&2; exit 1; }
          [ ${#PW} -ge 16 ] || { echo "Password must be at least 16 characters." >&2; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate PKCS12 keystore
        env:
          KS_PW: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p out
          keytool -genkeypair -keystore out/release.p12 -storetype PKCS12 \
            -alias instinct-lite -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=instinct-lite" -storepass:env KS_PW -keypass:env KS_PW
          base64 -w0 out/release.p12 > out/SIGNING_KEYSTORE_BASE64.txt
          rm out/release.p12
          keytool -list -v -keystore <(base64 -d out/SIGNING_KEYSTORE_BASE64.txt) -storepass:env KS_PW 2>/dev/null | grep -E "SHA256|Alias" > out/certificate-fingerprint.txt || true
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: signing-keystore-DELETE-AFTER-DOWNLOAD
          path: out/
          retention-days: 1
